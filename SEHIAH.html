<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>SETA HIAH</title>
  <style>
    body {
      background-color: #141414;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    h1 {
      margin-top: 50px;
    }
    .profiles, .apps {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 40px 0;
      flex-wrap: wrap;
    }
    .card {
      background-color: #333;
      padding: 20px;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.2s;
      width: 120px;
    }
    .card:hover {
      transform: scale(1.1);
      background-color: #555;
    }
    .card img {
      width: 60px;
      height: 60px;
      margin-bottom: 10px;
    }
    .hidden {
      display: none;
    }
    .info {
      margin-top: 20px;
      font-size: 14px;
      color: #ccc;
    }
  </style>
</head>
<body>
  <h1>[HIAH]   '   {Select a profile}</h1>
  
  <!-- Perfis -->
  <div class="profiles">
    <div class="card" onclick="openProfile('User 1')">User 1</div>
    <div class="card" onclick="openProfile('User 2')">User 2</div>
    <div class="card" onclick="openProfile('User 3')">User 3</div>
    <div class="card" onclick="openProfile('User 4')">User 4</div>
  </div>
  
  <!-- Área de Apps -->
  <div id="appsArea" class="hidden">
    <h2 id="profileTitle"></h2>
    <div class="apps">
      <div class="card" onclick="openApp('YouTube')">
        <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg" alt="YouTube">
        YouTube
      </div>
      <div class="card" onclick="openApp('Ycha!')">
         
        Ycha!
      </div>
      <div class="card" onclick="openApp('Google')">
        <img src="https://upload.wikimedia.org/wikipedia/commons/2/2f/Google_2015_logo.svg" alt="Google">
        Google
      </div>
      <div class="card" onclick="openApp('Chrome')">
       
        Chrome
      </div>
      <div class="card" onclick="openApp('Gemini')">
       
        Gemini AI
      </div>
    </div>
    <div class="info" id="lastInfo"></div>
  </div>
  
  <script>
    let currentProfile = null;
    const appLinks = {
      "YouTube": "https://www.youtube.com",
      "Google": "https://www.google.com",
      "Chrome": "https://www.google.com",
      "Gemini": "https://gemini.google.com",
      "Ycha!": "https://ycha.simdif.com/"
    };

    function openProfile(profile) {
      currentProfile = profile;
      document.getElementById("profileTitle").innerText = "Profile: " + profile;
      document.getElementById("appsArea").classList.remove("hidden");

      // Mostrar histórico do perfil
      let infoText = "";
      const lastApp = localStorage.getItem(profile + "_lastApp");
      if (lastApp) infoText += "LAU: " + lastApp + ". ";

      for (let app in appLinks) {
        const loginStatus = localStorage.getItem(profile + "_" + app + "_login");
        if (loginStatus) {
          infoText += app + ": " + loginStatus + ". ";
        }
      }

      document.getElementById("lastInfo").innerText = infoText || "*Empty....*.";
    }

    function openApp(app) {
      localStorage.setItem(currentProfile + "_lastApp", app);
      localStorage.setItem(currentProfile + "_" + app + "_login", " ");

      document.getElementById("lastInfo").innerText = 
        "Último app usado: " + app + ". " + app + ":   ";

      window.open(appLinks[app], "_blank");
    }
  </script>
</body>
</html>
